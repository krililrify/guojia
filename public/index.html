<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafafc"><meta name="description" content="查看各套餐支持的国家、地区与节点当前状态。"><title>节点状态</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body data-view="public">
<header class="topbar"><a class="brand" href="/"><span class="brand-icon">◈</span> 节点服务<span class="brand-divider"></span><span class="brand-light">状态中心</span></a><span class="top-label"><span class="tiny-dot"></span> 服务状态</span></header>
<main class="container">
  <div class="eyebrow">NETWORK STATUS</div><h1>每一次连接，<br class="mobile-break">都有迹可循。</h1><p class="intro">查看套餐覆盖的国家与地区，了解节点当前的服务状态。</p>
  <section class="overview" aria-label="状态概览"><div class="overview-icon" id="overview-icon">···</div><div><h2 id="overview-title">正在获取节点状态</h2><p id="overview-description">请稍候</p></div><button id="refresh" class="refresh" type="button" aria-label="刷新节点状态">↻<span>刷新</span></button></section>
  <div class="section-heading"><div><h2>节点状态</h2><p>按套餐查看可用的国家与地区</p></div><div class="legend"><span><i class="dot available"></i>可用</span><span><i class="dot outage"></i>故障</span></div></div>
  <div class="toolbar"><nav class="tabs" aria-label="套餐筛选"><button data-tier="all" aria-pressed="true">全部套餐</button><button data-tier="1" aria-pressed="false">VIP1</button><button data-tier="2" aria-pressed="false">VIP2</button><button data-tier="3" aria-pressed="false">VIP3</button></nav><label class="search"><span>⌕</span><input id="search" placeholder="搜索国家 / 节点" aria-label="搜索国家或节点"></label></div>
  <div class="list-meta"><span id="count">正在加载…</span><span id="checked"></span></div>
  <div id="notice" class="notice" role="status" hidden></div><div id="node-grid" class="node-grid" aria-live="polite"></div>
  <div class="explanation"><span class="info-icon">i</span><p>状态由管理员人工维护，不代表实时测速或自动探测结果。实际可用节点以客户端订阅为准。</p></div>
  <footer><span>节点服务 · 状态中心</span><span id="updated">尚无状态更新</span></footer>
</main>
</body></html>
