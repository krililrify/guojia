<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>节点与权益管理</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body data-view="admin"><header class="topbar"><a class="brand" href="/"><span class="brand-icon">◈</span> 节点服务<span class="brand-divider"></span><span class="brand-light">管理后台</span></a><a href="/" class="text-link" target="_blank" rel="noopener">查看前台 ↗</a></header>
<main class="container admin-container"><div id="notice" class="notice" role="status" hidden></div>
<section id="login-panel" class="login-panel"><div class="eyebrow">ADMIN CONSOLE</div><h1>管理节点支持范围</h1><p class="intro">登录后维护国家、节点与套餐覆盖范围。</p><form id="login-form"><label>账号<input name="username" autocomplete="username" required maxlength="200"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1000"></label><button class="primary" type="submit">登录后台 →</button><p class="form-hint">登录会话有效期 8 小时</p></form></section>
<section id="admin-panel" hidden><div class="admin-title"><div><div class="eyebrow">ADMIN CONSOLE</div><h1>节点与权益管理</h1><p class="intro">保存后立即更新数据，前台每 30 秒刷新。</p></div><button id="logout" class="secondary">退出登录</button></div>
<div class="admin-layout"><section class="editor"><h2 id="editor-title">添加线路组</h2><p class="subtle">按国家添加线路组，一次设置多个节点，按等级自动向上包含</p><form id="node-form"><input type="hidden" name="id"><label>国家 / 地区<input id="country" name="country" list="country-options" placeholder="输入国家名称或代码，如 日本 / JP" required autocomplete="off"><datalist id="country-options"></datalist></label><label>线路组名称<input name="name" placeholder="例如：东京普通线路" required maxlength="60"></label><label>节点数量<input name="quantity" type="number" min="1" max="200" step="1" value="1" required><span class="subtle">1–200 个，同一国家自动汇总数量</span></label><input type="hidden" name="status" value="available"><label>最低支持套餐<select name="tiers" required><option value="1">VIP1 起（VIP1 / VIP2 / VIP3）</option><option value="2">VIP2 起（VIP2 / VIP3）</option><option value="3" selected>仅 VIP3</option></select><span class="subtle">更高等级自动包含，无需重复添加节点</span></label><label>管理备注 <span class="subtle">（选填，前台不展示）</span><textarea name="note" maxlength="200" rows="3" placeholder="例如：内部线路分组说明"></textarea></label><label>排序 <span class="subtle">（数字越小越靠前）</span><input name="sort_order" type="number" min="-99999" max="99999" step="1" value="0" required></label><div class="form-actions"><button class="primary" type="submit">保存线路组</button><button class="secondary" type="button" id="reset-form">清空 / 取消编辑</button></div></form></section>
<section class="admin-list"><div class="section-heading"><h2>已发布线路组 <span id="admin-count" class="subtle"></span></h2><button class="secondary" id="reload-admin">刷新</button></div><p class="subtle">维护国家、数量与最低等级；更高等级自动包含。</p><div id="admin-nodes"></div></section></div></section>
</main></body></html>
