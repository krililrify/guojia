<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>节点管理</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body data-view="admin"><header class="topbar"><a class="brand" href="/"><span class="brand-icon">◈</span> 节点服务<span class="brand-divider"></span><span class="brand-light">管理后台</span></a><a href="/" class="text-link" target="_blank" rel="noopener">查看前台 ↗</a></header>
<main class="container admin-container"><div id="notice" class="notice" role="status" hidden></div>
<section id="login-panel" class="login-panel"><div class="eyebrow">ADMIN CONSOLE</div><h1>管理节点状态</h1><p class="intro">登录后维护国家、节点与套餐覆盖范围。</p><form id="login-form"><label>账号<input name="username" autocomplete="username" required maxlength="200"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1000"></label><button class="primary" type="submit">登录后台 →</button><p class="form-hint">登录会话有效期 8 小时</p></form></section>
<section id="admin-panel" hidden><div class="admin-title"><div><div class="eyebrow">ADMIN CONSOLE</div><h1>节点管理</h1><p class="intro">保存后立即更新数据，前台每 30 秒刷新。</p></div><button id="logout" class="secondary">退出登录</button></div>
<div class="admin-layout"><section class="editor"><h2 id="editor-title">添加节点</h2><p class="subtle">选择国家后自动显示国旗</p><form id="node-form"><input type="hidden" name="id"><label>国家 / 地区<input id="country" name="country" list="country-options" placeholder="输入国家名称或代码，如 日本 / JP" required autocomplete="off"><datalist id="country-options"></datalist></label><label>节点名称<input name="name" placeholder="例如：日本 · 东京 01" required maxlength="60"></label><fieldset><legend>服务状态</legend><div class="radio-group"><label><input type="radio" name="status" value="available" checked><i class="dot available"></i>可用</label><label><input type="radio" name="status" value="outage"><i class="dot outage"></i>故障</label></div></fieldset><fieldset><legend>适用套餐 <span class="subtle">（至少选择一个）</span></legend><div class="radio-group"><label><input type="checkbox" name="tiers" value="1">VIP1</label><label><input type="checkbox" name="tiers" value="2">VIP2</label><label><input type="checkbox" name="tiers" value="3" checked>VIP3</label></div></fieldset><label>备注 <span class="subtle">（选填，前台可见）</span><textarea name="note" maxlength="200" rows="3" placeholder="例如：线路维护中，恢复时间待定"></textarea></label><label>排序 <span class="subtle">（数字越小越靠前）</span><input name="sort_order" type="number" min="-99999" max="99999" step="1" value="0" required></label><div class="form-actions"><button class="primary" type="submit">保存节点</button><button class="secondary" type="button" id="reset-form">清空 / 取消编辑</button></div></form></section>
<section class="admin-list"><div class="section-heading"><h2>已发布节点 <span id="admin-count" class="subtle"></span></h2><button class="secondary" id="reload-admin">刷新</button></div><p class="subtle">点击状态可快速切换；也可以编辑完整信息。</p><div id="admin-nodes"></div></section></div></section>
</main></body></html>
